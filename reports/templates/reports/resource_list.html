<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ type_label }} - Resources</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: auto; padding: 20px; }
        h1 { text-align: center; }
        .resource-item { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .resource-item h2 { margin-top: 0; }
        .resource-item p { white-space: pre-wrap; /* Preserves formatting of content */ }
        .resource-item .source { font-style: italic; color: #6c757d; text-align: right; margin-top: 15px; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <a href="{% url 'resource_landing' %}" class="back-link">&larr; Back to Categories</a>

    <h1>{{ type_label }}</h1>

    {% if resources %}
        {% for resource in resources %}
            <div class="resource-item">
                <h2>{{ resource.title }}</h2>
                <p>{{ resource.content }}</p>
                {% if resource.source %}
                    <p class="source">&mdash; {{ resource.source }}</p>
                {% endif %}
            </div>
        {% endfor %}
    {% else %}
        <p style="text-align: center;">No resources found in this category yet.</p>
    {% endif %}

</body>
</html>
